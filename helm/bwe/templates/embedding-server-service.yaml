{{- with .Values.embeddingServer }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bwe.fullname" $ }}-embedding-server
  labels:
    {{- include "bwe.labels" $ | nindent 4 }}
    app.kubernetes.io/component: embedding-server
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .service.type "NodePort") .service.nodePort }}
      nodePort: {{ .service.nodePort }}
      {{- end }}
  selector:
    {{- include "bwe.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: embedding-server
{{- end }}

