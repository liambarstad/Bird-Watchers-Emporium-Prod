{{- with .Values.app }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bwe.fullname" $ }}-app
  labels:
    {{- include "bwe.labels" $ | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .service.type "NodePort") .service.nodePort }}
      nodePort: {{ .service.nodePort }}
      {{- end }}
  selector:
    {{- include "bwe.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: app
{{- end }}

