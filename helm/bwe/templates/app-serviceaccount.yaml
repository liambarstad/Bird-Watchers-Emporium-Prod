{{- with .Values.app }}
{{- if .serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bwe.serviceAccountName" $ }}
  labels:
    {{- include "bwe.labels" $ | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .serviceAccount.automount }}
{{- end }}
{{- end }}

