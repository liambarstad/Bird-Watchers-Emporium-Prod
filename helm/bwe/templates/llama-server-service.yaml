{{- with .Values.llamaServer }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bwe.fullname" $ }}-llama-server
  labels:
    {{- include "bwe.labels" $ | nindent 4 }}
    app.kubernetes.io/component: llama-server
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .service.type "NodePort") .service.nodePort }}
      nodePort: {{ .service.nodePort }}
      {{- end }}
  selector:
    {{- include "bwe.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: llama-server
{{- end }}
{{- end }}
