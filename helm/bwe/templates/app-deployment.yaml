{{- with .Values.app }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bwe.fullname" $ }}-app
  labels:
    {{- include "bwe.labels" $ | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bwe.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      {{- with .podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bwe.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: app
        {{- with .podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bwe.serviceAccountName" $ }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          image: "{{ .image.repository }}:{{ .image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .env.API_PORT | int }}
              protocol: TCP
          env:
            {{- range $key, $value := .env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: LLAMA_HOST
              value: "{{ include "bwe.fullname" $ }}-llama-server"
            - name: LLAMA_PORT
              value: "{{ $.Values.llamaServer.service.port | default 8080 }}"
            - name: NEO4J_URI
              value: "bolt://{{ include "bwe.fullname" $ }}-neo4j:{{ $.Values.neo4j.service.boltPort | default 7687 }}"
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.neo4j.authSecretName }}
                  key: NEO4J_USER
            - name: NEO4J_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.neo4j.authSecretName }}
                  key: NEO4J_PWD
            - name: EMBEDDING_HOST
              value: "{{ include "bwe.fullname" $ }}-embedding-server"
            - name: EMBEDDING_PORT
              value: "{{ $.Values.embeddingServer.service.port | default 8090 }}"
          livenessProbe:
            {{- toYaml .livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- with .volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

