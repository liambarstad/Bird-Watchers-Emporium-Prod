app:
  
  #replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 50
    # targetMemoryUtilizationPercentage: 80

  image:
    repository: docker.io/library/bwe-api
    pullPolicy: Never
    tag: "latest"

  imagePullSecrets: []
  nameOverride: ""
  fullNameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext: {}

  service:
    type: ClusterIP
    port: 80
    targetPort: 8000

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: bwe.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  env:
    APP_ENV: "production"
    API_HOST: "0.0.0.0"
    API_PORT: "8000"
    LOG_LEVEL: "INFO"
    # LLAMA_HOST, LLAMA_PORT are set in the llama server deployment template
    # NEO4J URI, USER, PWD are set in the neo4j deployment template
    NEO4J_DATABASE: "neo4j"
    # EMBEDDING_HOST, EMBEDDING_PORT are set in the embedding server deployment template

  resources: {}

  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  volumes: []

  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

llamaServer:
  enabled: true
  replicaCount: 1

  image:
    repository: docker.io/library/bwe-llama-server
    pullPolicy: Never
    tag: "latest"
    #repository: ghcr.io/ggml-org/llama.cpp
    #pullPolicy: IfNotPresent
    #tag: server-vulkan


  imagePullSecrets: []

  storage:
    modelPath: /data/models
    readOnly: true

  user:
    userId: 1001 
    groupId: 1002
    #supplementalGroups:
    #- 988
    #- 984

  host: "0.0.0.0"
  port: 8080

  #command: "llama-server"
  commandArgs:
    continuousBatching: true
    numParallelSlots: 4
    modelFile: Qwen3-30B-A3B-Thinking-2507-Q4_0.gguf
    mmproj: false
    #chatTemplate: qwen3
    #mmprojFile: mmproj-Qwen3VL-30B-A3B-Thinking-Q8_0.gguf
    contextWindow: 2048
    #cacheKeyQuantization: f16
    cacheKeyQuantization: q8_0
    cacheValueQuantization: q8_0
    layersInVRAM: 99

  service:
    type: ClusterIP
    port: 8080

  podSecurityContext: {}

  podAnnotations: {}
  podLabels: {}

  livenessProbe:
    httpGet:
      path: /health
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  resources:
    #requests:
    #  cpu: "2"
    #  memory: "8Gi"
    #  amd.com/gpu: 1
    limits:
      #  cpu: "8"
      #  memory: "32Gi"
      # amd.com/gpu: 1
      # Consume one "share" advertised by the gpu-share-plugin DaemonSet
      amd.com/gpu-share: 1

  nodeSelector: {}

  tolerations: []

  affinity: {}

neo4j:

  replicaCount: 1

  image:
    repository: docker.io/library/bwe-neo4j-db
    pullPolicy: Never
    tag: "latest"

  port: 7474
  boltPort: 7687

  service:
    type: ClusterIP
    httpPort: 7474
    boltPort: 7687

  user:
    userId: 1002
    groupId: 1003

  env:
    updateFromDump: 1
    dumpFileName: 01_07.dump

  authSecretName: bwe-neo4j-auth

  extraEnv:
    NEO4J_server_memory_heap_initial__size: "512m"
    NEO4J_server_memory_heap_max__size: "768m"
    NEO4J_server_memory_pagecache_size: "768m"

  storage:
    hostPath: /data/db/neo4j/bwe
    mountPath: /data
    dbDir: /data

  livenessProbe:
    httpGet:
      path: /
      port: 7474
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /
      port: 7474
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

# GPU share device plugin (DaemonSet) that advertises `amd.com/gpu-share` resources to kubelet.
gpuSharePlugin:
  enabled: true

  image:
    repository: docker.io/library/amd-gpu-share-plugin
    tag: "latest"
    pullPolicy: Never

  shares: 8

  # Nodes where kubelet has access to the AMD GPU device files
  nodeSelector:
    amd-gpu: "true"

  tolerations:
    - operator: Exists

  resources: {}

embeddingServer:
  replicaCount: 1

  image:
    repository: docker.io/library/bwe-embedding-server
    pullPolicy: Never
    tag: "latest"

  imagePullSecrets: []

  port: 8090

  env:
    API_NAME: "bwe-embedding-server"
    API_VERSION: "0.1.0"
    API_HOST: "0.0.0.0"
    API_PORT: "8090"
    APP_ENV: "production"
    MODEL_PATH: "/data/models/nomic-embed-multimodal-3b"
    MODEL_DEVICE: "cuda"

  rocm:
    hostPath: /opt/rocm
    mountPath: /opt/rocm
    readOnly: true

  models:
    hostPath: /data/models
    mountPath: /data/models
    readOnly: true

  podAnnotations: {}
  podLabels: {}

  livenessProbe:
    httpGet:
      path: /health
      port: 8090
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8090
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  resources:
    limits:
      amd.com/gpu-share: 1

  service:
    type: ClusterIP
    port: 8090

  nodeSelector: {}

  tolerations: []

  affinity: {}