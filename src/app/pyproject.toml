[build-system]
requires = ['setuptools>=61.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'bwe-prod'
version = '0.1.0'
description = 'Bird Watchers Emporium'
requires-python = '>=3.12'
license = 'MIT'
authors = [
    {name = 'Liam Barstad', email = 'liambarstad@gmail.com'}
]

dependencies = [
    'pydantic==2.12.4',
    'pydantic-settings==2.12.0',
    'fastapi==0.121.1',
    'uvicorn==0.35.0',
    'httpx==0.28.1',
    'langchain==0.3.27',
    'langgraph==0.6.10',
    'langchain-community==0.3.30',
    'langchain-neo4j==0.6.0',
    'langchain-openai==0.3.16',
]

[project.optional-dependencies]
dev = [
]

[project.scripts]
bwe = 'main:main'

[tool.setuptools]
packages = ['graphs', 'nodes', 'tools', 'utils']
py-modules = ['config', 'main', 'state']

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = '3.12'
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
